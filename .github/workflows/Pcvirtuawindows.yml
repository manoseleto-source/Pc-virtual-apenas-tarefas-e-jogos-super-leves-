name: Windows RDP Pinggy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔑 Criar Usuário e Habilitar RDP
        run: |
          net user RunnerUser MinhaSenha123! /add
          net localgroup Administrators RunnerUser /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 🌐 Iniciar Pinggy e Exibir Endereço TCP
        shell: powershell
        run: |
          # Criar script em VBScript para executar o SSH sem esconder a saída TTY
          $vbs = @"
          Set WshShell = CreateObject("WScript.Shell")
          WshShell.Run "cmd /c ssh -o StrictHostKeyChecking=no -p 443 -R 0:localhost:3389 qr@a.pinggy.io > %TEMP%\pinggy.txt 2>&1", 0, False
          "@
          Set-Content -Path "$env:TEMP\run_pinggy.vbs" -Value $vbs

          # Executa o script em segundo plano
          cscript //nologo "$env:TEMP\run_pinggy.vbs"

          # Aguarda 12 segundos para o Pinggy conectar e gravar o endereço
          Start-Sleep -Seconds 12

          echo "=========================================="
          if (Test-Path "$env:TEMP\pinggy.txt") {
            Get-Content "$env:TEMP\pinggy.txt"
          } else {
            echo "Aguardando arquivo de log..."
          }
          echo "=========================================="

      - name: ⚡ Manter Máquina Ligada
        run: |
          cmd /c "echo RDP ativo! & pause > nul"
          
