name: Windows RDP Playit

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔑 Criar Usuário e Habilitar RDP
        run: |
          net user RunnerUser MinhaSenha123! /add
          net localgroup Administrators RunnerUser /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 🌐 Iniciar Playit
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/playit-cloud/playit-agent/releases/download/v0.15.26/playit-windows-x86_64.exe" -OutFile "playit.exe"
          Start-Process -FilePath ".\playit.exe" -ArgumentList "--secret playit" -RedirectStandardOutput "playit.log" -RedirectStandardError "playit_err.log"

          Start-Sleep -Seconds 10

          echo "=========================================="
          if (Test-Path playit.log) { Get-Content playit.log }
          if (Test-Path playit_err.log) { Get-Content playit_err.log }
          echo "=========================================="

      - name: ⚡ Manter Máquina Ligada
        run: |
          cmd /c "echo RDP ativo! & pause > nul"
          
