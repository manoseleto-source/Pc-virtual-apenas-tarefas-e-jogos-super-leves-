name: Windows RDP Localtunnel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔑 Criar Usuário e Habilitar RDP
        run: |
          net user RunnerUser MinhaSenha123! /add
          net localgroup Administrators RunnerUser /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 🌐 Iniciar Túnel e Exibir Endereço
        shell: powershell
        run: |
          npm install -g localtunnel
          Start-Process npx -ArgumentList "localtunnel --port 3389" -RedirectStandardOutput "lt.log"

          Start-Sleep -Seconds 8

          if (Test-Path lt.log) {
            $log = Get-Content lt.log -Raw
            if ($log -match "(https://[a-zA-Z0-9\.-]+)") {
              $url = $matches[1] -replace "https://", ""
              echo "=========================================="
              echo "COPIE E COLE ISSO NO WINDOWS APP:"
              echo $url
              echo "=========================================="
            } else {
              Get-Content lt.log
            }
          }

      - name: ⚡ Manter Máquina Ligada
        run: |
          cmd /c "echo RDP ativo via Localtunnel! & pause > nul"
          
