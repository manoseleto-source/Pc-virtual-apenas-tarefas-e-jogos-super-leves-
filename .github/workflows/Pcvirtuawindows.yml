name: Windows RDP Pinggy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔑 Criar Usuário e Habilitar RDP
        run: |
          net user RunnerUser MinhaSenha123! /add
          net localgroup Administrators RunnerUser /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 🌐 Iniciar Pinggy e Exibir Endereço TCP
        shell: powershell
        run: |
          # Executa o túnel TCP do Pinggy para a porta 3389 do RDP
          cmd /c "start /b ssh -n -T -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R 0:localhost:3389 qr@a.pinggy.io > pinggy.log 2>&1"

          # Aguarda 15 segundos para garantir a criação da conexão
          Start-Sleep -Seconds 15

          echo "=========================================="
          if (Test-Path pinggy.log) {
            $log = Get-Content pinggy.log -Raw
            echo $log
          } else {
            echo "Aguardando geração do log..."
          }
          echo "=========================================="

      - name: ⚡ Manter Máquina Ligada
        run: |
          cmd /c "echo RDP ativo! & pause > nul"
          
