name: Windows RDP Pinggy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔑 Criar Usuário e Habilitar RDP
        run: |
          net user RunnerUser MinhaSenha123! /add
          net localgroup Administrators RunnerUser /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 🌐 Iniciar Túnel e Exibir Endereço
        shell: cmd
        run: |
          echo ==========================================
          echo O ENDEREÇO DE CONEXÃO VAI APARECER ABAIXO:
          echo ==========================================
          start /b ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p 443 -R 0:localhost:3389 qr@a.pinggy.io
          timeout /t 10 /nobreak

      - name: ⚡ Manter Máquina Ligada
        run: |
          cmd /c "echo RDP ativo! & pause > nul"
          
