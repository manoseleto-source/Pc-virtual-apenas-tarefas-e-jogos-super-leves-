name: Windows RDP Cloudflare

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔑 Criar Usuário e Habilitar RDP
        run: |
          net user RunnerUser MinhaSenha123! /add
          net localgroup Administrators RunnerUser /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 🌐 Iniciar Túnel Cloudflare e Exibir Endereço
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe" -OutFile "cloudflared.exe"
          
          # Inicia o túnel TCP para o RDP
          $process = Start-Process -FilePath ".\cloudflared.exe" -ArgumentList "tunnel --url tcp://localhost:3389" -RedirectStandardError "cloudflared.log" -PassThru

          Start-Sleep -Seconds 10

          echo "=========================================="
          if (Test-Path cloudflared.log) {
            Select-String -Path "cloudflared.log" -Pattern "trycloudflare.com" | ForEach-Object { $_.Line }
          }
          echo "=========================================="

      - name: ⚡ Manter Máquina Ligada
        run: |
          cmd /c "echo RDP ativo! & pause > nul"
          
