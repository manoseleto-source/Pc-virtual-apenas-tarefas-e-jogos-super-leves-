name: Windows RDP Ngrok

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔑 Criar Usuário e Habilitar RDP
        run: |
          net user RunnerUser MinhaSenha123! /add
          net localgroup Administrators RunnerUser /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 🌐 Instalar e Ativar Ngrok
        shell: powershell
        run: |
          choco install ngrok -y
          ngrok config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          Start-Process ngrok -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log" -RedirectStandardError "ngrok_err.log"

      - name: 📌 Exibir Endereço de Conexão
        shell: powershell
        run: |
          $maxAttempts = 12
          $attempt = 0
          $url = $null

          while ($attempt -lt $maxAttempts) {
            Start-Sleep -Seconds 5
            $attempt++
            try {
              $log = Invoke-RestMethod -Uri http://127.0.0.1:4040/api/tunnels -ErrorAction Stop
              $url = $log.tunnels[0].public_url
              if ($url) { break }
            } catch {
              echo "Aguardando Ngrok iniciar... (Tentativa $attempt de $maxAttempts)"
            }
          }

          if ($url) {
            echo "=========================================="
            echo "CONECTE NO WINDOWS APP USANDO ESTE ENDEREÇO:"
            echo $url
            echo "=========================================="
          } else {
            echo "⚠️ Falha ao obter a URL do Ngrok. Verifique o secret NGROK_AUTH_TOKEN."
            if (Test-Path ngrok_err.log) { Get-Content ngrok_err.log }
            if (Test-Path ngrok.log) { Get-Content ngrok.log }
            exit 1
          }

      - name: ⚡ Manter Máquina Ligada
        run: |
          cmd /c "echo RDP ativo via Ngrok! & pause > nul"
          
