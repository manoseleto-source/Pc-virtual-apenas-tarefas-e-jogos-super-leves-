name: Windows RDP Pinggy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 🔑 Criar Usuário e Habilitar RDP
        run: |
          net user RunnerUser MinhaSenha123! /add
          net localgroup Administrators RunnerUser /add
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: 🌐 Iniciar Túnel RDP
        shell: powershell
        run: |
          $client = New-Object System.Net.Sockets.TcpClient("a.pinggy.io", 443)
          # Conecta via SSH/Pinggy sem precisar de conta ou cartão
          Start-Process ssh -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R 0:localhost:3389 qr@a.pinggy.io" -RedirectStandardOutput "pinggy.log" -RedirectStandardError "pinggy_err.log"

      - name: 📌 Exibir Endereço de Conexão
        shell: powershell
        run: |
          $maxAttempts = 10
          $attempt = 0
          $found = $false

          while ($attempt -lt $maxAttempts) {
            Start-Sleep -Seconds 3
            $attempt++
            if (Test-Path pinggy.log) {
              $content = Get-Content pinggy.log -Raw
              if ($content -match "tcp://([a-zA-Z0-9\.-]+:\d+)") {
                $address = $matches[1]
                echo "=========================================="
                echo "CONECTE NO WINDOWS APP USANDO ESTE ENDEREÇO:"
                echo $address
                echo "=========================================="
                $found = $true
                break
              }
            }
          }

          if (-not $found) {
            echo "Aguardando link do Pinggy..."
            if (Test-Path pinggy.log) { Get-Content pinggy.log }
            if (Test-Path pinggy_err.log) { Get-Content pinggy_err.log }
          }

      - name: ⚡ Manter Máquina Ligada
        run: |
          cmd /c "echo RDP ativo via Pinggy! & pause > nul"
          
